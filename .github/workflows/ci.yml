name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (engine + site)
        run: pnpm build

      - name: Typecheck
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Registry drift check
        run: |
          pnpm -C apps/web registry:build
          git diff --exit-code -- apps/web/public/r apps/web/registry.json

      - name: Theme lockstep check
        run: node scripts/check-theme-sync.mjs

      - name: Site e2e — refraction + axe (Chromium)
        run: |
          pnpm -C apps/web exec playwright install --with-deps chromium
          pnpm -C apps/web test:e2e
